<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="product-holder">
    <div class="product-card">
        <div class="product-card__body">
            <img class="product-card__image" src="product.png"/>
            <div class="product-card__description">
                <div class="product-card__description-top">
                    <a href="/somewhere" class="product-card__title">123123123123123sfkgjsldkfjglskdgksjkgdsjgjsgjsd;klgskdgjskdjglksjgklsjglkdjglskdjgsdjgl;jlg;sjgdj;</a>
                    <div class="product-card__rating">
                        <p class="product-card__stars">★★★★☆</p> <!-- //change this using js -->
                        <p class="product-card__reviews">123</p>
                    </div>
                </div>
                <div class="product-card__description-bottom">
                    <p class="product-card__remains">1234 left</p>
                    <div class="product-card__price-block">
                        <p class="product-card__old-price">999 ₽</p>
                        <p class="product-card__current-price">699 ₽</p>                 
                    </div>
                </div>
            </div>
        </div>
        <div class="product-card__bottom">
            <button class="product-card__order-button">Order delivery</button>
            <button class="product-card__cart-button">Add to cart</button>
        </div>
    </div>
</body>
</html>
